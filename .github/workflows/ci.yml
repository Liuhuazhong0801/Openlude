name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Verify Windows observer input and process detection
        if: runner.os == 'Windows'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_CUSTOM_DIR: "{{ version }}"
        run: |
          node node_modules/electron/install.js
          npm run test:windows-observer
      - name: Build standalone motion preview
        run: npm run build:preview

  package:
    name: Package installers (${{ matrix.platform }}-${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CUSTOM_DIR: "{{ version }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installers and record checksums
        env:
          # Builder validates mirrored Mac tools against its pinned upstream checksums.
          ELECTRON_BUILDER_BINARIES_MIRROR: ${{ runner.os == 'macOS' && 'https://npmmirror.com/mirrors/electron-builder-binaries/' || '' }}
        run: npm run pack:release -- --arch ${{ matrix.arch }}
      - name: Upload downloadable installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Openlude-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: release/installers/${{ matrix.platform }}-${{ matrix.arch }}/downloads/
