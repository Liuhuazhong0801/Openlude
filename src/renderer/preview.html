<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>启动动画预览</title>
    <script type="module" src="./preview.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>启动动画预览</h1>
          <p>选择应用和动画，查看启动前的效果。</p>
        </div>
        <label class="app-picker"
          >应用
          <select id="demo-app">
            <option value="codex" data-icon="./assets/apps/codex.png">
              Codex
            </option>
            <option value="workbuddy" data-icon="./assets/apps/workbuddy.svg">
              WorkBuddy
            </option>
            <option value="deepseek" data-icon="./assets/apps/deepseek.png">
              DeepSeek
            </option>
            <option value="doubao" data-icon="./assets/apps/doubao.png">
              豆包
            </option>
          </select>
        </label>
      </header>
      <div id="theme-picker" aria-label="选择主题"></div>
      <section class="demo-stage" id="demo-stage" aria-label="启动动画预览">
        <div class="app-emblem">
          <img id="demo-app-icon" alt="" hidden />
        </div>
        <div class="scene-caption">
          <span id="current-name">光环穿梭</span>
        </div>
      </section>
      <div class="controls">
        <button id="demo-play">↻ 再播放一次</button
        ><label><input type="checkbox" id="demo-loop" checked />循环预览</label>
        <label><input type="checkbox" id="demo-icon" checked />显示应用图标</label>
        <div class="progress"><i id="demo-progress"></i></div>
        <span>2.6 秒</span
        ><button class="subtle" id="demo-fullscreen">全屏观看 ↗</button>
      </div>
      <footer>
        <p id="motion-description"></p>
        <span>此页面用于观看动效；应用启动与绑定在桌面版中操作。</span>
      </footer>
    </main>
  </body>
</html>
